<text x="70" y="1762" font-size="15" fill="#3a3934">ทุกหน้าที่เป็นข้อมูลภายใน ต้องใส่รหัสถึงจะเปิดได้ · คนนอกที่รู้ลิงก์ก็เข้าไม่ได้ · ลูกค้าเห็นได้แค่ชื่อสินค้า ราคา และ มี/หมด</text>

