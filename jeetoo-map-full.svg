<g font-size="14" fill="#6b6a63"><text x="70" y="1652">ลูกค้าเปิดดูเอง</text><text x="70" y="1676">65 รุ่น 883 กลิ่น</text><text x="70" y="1700">บอกแค่ “มี / หมด”</text></g>

