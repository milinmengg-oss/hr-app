<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ABC Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Kanit',sans-serif;background:#0a0a0c;color:#fff}
.page{display:none;min-height:100vh;max-width:520px;margin:0 auto}
.page.on{display:block}
#home{background:linear-gradient(160deg,#fdfdfd,#ececec);text-align:center;padding:36px 20px 46px;color:#111}
.logo{font-size:64px;font-weight:900;letter-spacing:1px;background:linear-gradient(115deg,#8ef05e,#37c86f 26%,#111 55%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
#home h1{font-size:30px;font-weight:900;margin-top:4px}
.instr{display:inline-block;border:1.5px solid #111;border-radius:8px;padding:5px 16px;font-size:12.5px;margin-top:12px}
.live{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:#eef7ee;border:1px solid #bfe3c6;border-radius:99px;padding:5px 14px;font-size:12px;color:#1d7c3d}
.live .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.35}}
.catlist{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.catbtn{display:flex;align-items:center;gap:12px;background:#0f1114;color:#fff;border-radius:12px;padding:13px 18px;font-size:16.5px;font-weight:800;cursor:pointer;border:none;font-family:inherit;text-align:left}
.catbtn .ic{font-size:18px}
.catbtn .arr{margin-left:auto;background:#fff;color:#111;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.homefoot{font-size:10.5px;color:#8a8a8a;margin-top:26px;line-height:1.8}
.cpage{background:#0a0a0c}
.banner{position:sticky;top:0;z-index:10;background:linear-gradient(100deg,#15171c 45%,#2e333d);display:flex;align-items:center;padding:15px 16px;gap:10px;border-bottom:1px solid #23252b}
.banner h2{font-size:26px;font-weight:900;color:#fff}
.banner .abc{font-weight:900;font-size:14px;color:#8ef05e;margin-left:2px}
.back{margin-left:auto;background:#fff;color:#111;border:none;border-radius:9px;padding:8px 13px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.body{padding:14px 12px 92px}
.model{margin-top:24px}
.mhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:0 2px}
.mhead b{font-size:20px;font-weight:900;letter-spacing:.4px;font-style:italic}
.puff{font-size:13px;font-weight:800;color:#dfe3ea}
.price{background:#c6f45f;color:#111;font-weight:900;font-size:14px;border-radius:99px;padding:2px 12px}
.oos{font-size:10.5px;color:#ff9d9d;background:#331414;border:1px solid #5d2727;border-radius:99px;padding:2px 10px}
.havecnt{font-size:10.5px;color:#9fe6b4;background:#122612;border:1px solid #2b5c38;border-radius:99px;padding:2px 10px}
.dbox{display:flex;gap:9px;margin-top:9px}
.dcol{width:42%;flex-shrink:0;display:flex;flex-direction:column;gap:7px}
.tag{background:linear-gradient(110deg,#191b20,#23262e);border:1px solid #2e313a;border-radius:11px;padding:9px 11px;font-size:12px;line-height:1.45}
.tagimg{width:100%;max-height:110px;object-fit:cover;border-radius:11px;display:block;border:1px solid #2e313a}
.tag small{display:block;color:#9a9fa9;font-size:10px}
.tag b{font-size:13.5px;font-weight:900}
.spec{background:#15161b;border:1px solid #26272e;border-radius:11px;padding:9px 11px;display:flex;gap:14px}
.spec .it{flex:1;text-align:center}
.spec b{display:block;font-size:14px;font-weight:900}
.spec small{font-size:9.5px;color:#9a9fa9}
.promo{background:linear-gradient(110deg,#20240f,#2b3311);border:1px solid #4a5a1e;border-radius:11px;padding:9px 11px;font-size:11px;line-height:1.4;color:#d9f0a3}
.promo small{display:block;font-size:9.5px;color:#9aa86e}
.promo b{font-size:12.5px;font-weight:900;color:#dcff8a}
.dbox{align-items:stretch}
.dcol{justify-content:flex-start}
.mainimg{height:300px}
.use{background:#eafbe0;color:#14401f;border-radius:11px;padding:8px 11px;font-size:11px;line-height:1.4}
.use small{display:block;font-size:9.5px;color:#3f7a4e}
.use b{font-size:12.5px;font-weight:900}
.imgcard{background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px;flex:1;min-height:120px}
.imgcard img{width:100%;max-height:220px;object-fit:contain}
.mainimg{flex:1;background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:10px;height:300px}
.mainimg img{width:100%;height:280px;object-fit:contain}
.noimg{color:#bbb;font-size:11px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:9px}
.chip{display:flex;align-items:center;gap:7px;font-size:11.5px;padding:7px 11px;border-radius:99px;background:#26262c;border:1px solid #35353d;color:#c9c9d1}
.chip .fe{font-size:13px;filter:grayscale(1);opacity:.5}
.chip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.in{background:#f5f5f6;border-color:#fff;color:#111;font-weight:700}
.chip.in .fe{filter:none;opacity:1}
.note{font-size:12px;color:#7c7c85;margin-top:6px;padding:0 2px}
.legend{display:flex;gap:16px;justify-content:center;font-size:11.5px;color:#8b8b93;margin-top:18px}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:15px;height:15px;border-radius:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d0d10f5;border-top:1px solid #232329;z-index:20;backdrop-filter:blur(8px)}
.bar .in{max-width:520px;margin:0 auto;display:flex;gap:9px;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.bar a,.bar button{flex:1;text-align:center;border-radius:12px;padding:12px;font-weight:800;font-size:14px;text-decoration:none;border:none;font-family:inherit;cursor:pointer}
.b1{background:#c6f45f;color:#111}
.b2{background:#232329;color:#fff;border:1px solid #33333b}

/* search */
.swrap{max-width:560px;margin:14px auto 0;position:relative;padding:0 4px}
#q{width:100%;background:#fff;border:1.5px solid #111;border-radius:12px;padding:11px 14px;font-family:inherit;font-size:14.5px;color:#111}
#q:focus{outline:none;box-shadow:0 0 0 3px #c6f45f}
#qres{position:relative;background:#fff;border:1.5px solid #111;border-radius:12px;margin-top:6px;text-align:left;max-height:320px;overflow:auto;display:none}
.qitem{padding:10px 13px;border-bottom:1px solid #eee;cursor:pointer;font-size:13.5px}
.qitem:last-child{border-bottom:0}
.qitem b{display:block;font-size:14px}
.qitem small{color:#666}
.qnone{padding:12px;color:#888;font-size:13px;text-align:center}
@keyframes flash{0%{box-shadow:0 0 0 3px #c6f45f}100%{box-shadow:0 0 0 0 transparent}}
.model.hl{animation:flash 1.6s ease-out 2}
/* order sheet */
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none}
#sheet{position:fixed;left:0;right:0;bottom:-100%;z-index:61;background:#17181d;border-radius:18px 18px 0 0;padding:18px 16px 26px;max-width:560px;margin:0 auto;transition:bottom .22s ease;border:1px solid #2b2d35;border-bottom:0}
#sheet.on{bottom:0}
#sheet h3{color:#fff;font-size:16px;margin-bottom:2px}
#sheet .fl{color:#c6f45f;font-size:15px;font-weight:600;margin-bottom:4px}
#sheet .stx{font-size:12.5px;color:#9a9ba3;margin-bottom:14px}
#sheet .msgprev{background:#101116;border:1px dashed #33353e;border-radius:10px;padding:10px 12px;color:#ddd;font-size:13.5px;margin-bottom:14px}
#sheet button{width:100%;border:0;border-radius:12px;padding:13px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}
#sheet .go{background:#c6f45f;color:#111;margin-bottom:8px}
#sheet .cls{background:#26272e;color:#ccc;font-weight:400;font-size:13.5px;padding:10px}
#sheet .copied{font-size:12.5px;color:#4ade80;text-align:center;margin-bottom:8px;min-height:16px}
</style>
</head>
<body>
<div class="page on" id="home">
  <div class="logo">ABC</div>
  <h1>≣ เมนูสินค้า</h1>
  <div><span class="instr">คลิกที่ "หมวดด้านล่าง" เพื่อเข้าชมสินค้าคุณภาพมากมาย</span></div>
  <div><span class="live"><span class="dot"></span><span id="livetxt">กำลังเช็คสต็อกสด…</span></span></div>
  <div class="swrap"><input id="q" placeholder="🔍 ค้นหารุ่นหรือกลิ่น เช่น องุ่น, marbo" autocomplete="off"><div id="qres"></div></div>
  <div class="catlist" id="catlist"></div>
  <div class="homefoot">สต็อกอัปเดตอัตโนมัติจากระบบคลังของร้าน · กลิ่นสีเข้มคือหมดชั่วคราว<br>ติดต่อสอบถาม/สั่งซื้อได้โดยตรงผ่านแชท LINE มีบริการจัดส่งด่วน และโปรโมชั่นมากมาย</div>
</div>
<div id="pages"></div>
<div class="bar"><div class="in">
  <button class="b2" id="backbtn" style="display:none" onclick="go('home')">‹ หน้าหลัก</button>
  <a class="b1" href="#" onclick="if(history.length>1)history.back();setTimeout(()=>{try{window.close()}catch(e){}},350);return false">💬 กลับแชทไลน์เพื่อสั่งซื้อ</a>
</div></div>
<div id="sheetbg" onclick="closeSheet()"></div>
<div id="sheet">
  <h3 id="sh_m"></h3><div class="fl" id="sh_f"></div><div class="stx" id="sh_st"></div>
  <div class="msgprev" id="sh_msg"></div>
  <div class="copied" id="sh_ok"></div>
  <button class="go" onclick="orderGo()">📋 คัดลอกข้อความ & กลับไปสั่งในแชท</button>
  <button class="cls" onclick="closeSheet()">ปิด</button>
</div>

    var PR={'หัวน้ำยา':'ครบ 10 หัว ส่งฟรี','BIG POD':'ครบ 4 ชิ้น ส่งฟรี','พอตใช้แล้วทิ้ง':'ครบ 4 แท่ง ส่งฟรี','BIG POD KIT':'ครบ 4 ชิ้น ส่งฟรี','เครื่องพอต':'สั่งคู่หัวน้ำยา คุ้มกว่า','เครื่อง BIG POD':'สั่งคู่หัว Big Pod คุ้มกว่า','SALTNIC':'สั่งคู่หัวเติม สอบถามโปรในแชท','FREEBASE':'สั่งคู่หัวเติม สอบถามโปรในแชท','IQOS':'สอบถามโปรในแชทได้เลย','เครื่อง IQOS':'สอบถามโปรในแชทได้เลย','NIC POUCH':'สอบถามโปรในแชทได้เลย'};
    var prm=m.promo||PR[c]; if(prm) h+='<div class="promo"><small>🎁 โปรโมชั่น</small><b>'+prm+'</b></div>';
    h+='</div>'+im+'</div>';
    if(m.f.length) h+='<div class="chips">'+m.f.map(f=>'<span class="chip" data-f="'+norm(f)+'" title="'+f+'"><span class="fe">'+(FEM[f]||"🍃")+'</span><span class="t">'+f+"</span></span>").join("")+'</div>';
    else h+='<div class="note">ไม่มีตัวเลือกกลิ่น/สี</div>';
    h+="</div>";
  });
  h+='<div class="legend"><span class="lg"><span class="sw" style="background:#f5f5f6"></span>มีของ</span><span class="lg"><span class="sw" style="background:#26262c;border:1px solid #3a3a42"></span>หมดชั่วคราว</span></div></div></div>';
  pg.insertAdjacentHTML("beforeend",h);
});
}
function go(id){ document.querySelectorAll(".page").forEach(p=>p.classList.remove("on")); document.getElementById(id).classList.add("on"); document.getElementById("backbtn").style.display=(id==="home")?"none":"block"; scrollTo(0,0); }
function loadStock(){
fetch(W+"/flavors").then(r=>r.json()).then(st=>{
  document.querySelectorAll(".model").forEach(md=>{
    const id=md.dataset.id; let have=0,tot=0;
    md.querySelectorAll(".chip").forEach(ch=>{ tot++; if(st[id+"|"+ch.dataset.f]===false){} else { ch.classList.add("in"); have++; } });
    if(tot){ if(have){ const hc=md.querySelector(".havecnt"); hc.textContent="มีของ "+have+" กลิ่น"; hc.style.display="inline-block"; } else md.querySelector(".oos").style.display="inline-block"; }
  });
  document.getElementById("livetxt").textContent="สต็อกสด · อัปเดต "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" น.";
}).catch(()=>{ document.querySelectorAll(".chip").forEach(ch=>ch.classList.add("in")); document.getElementById("livetxt").textContent="แสดงรายการสินค้า"; });
}
// ── โหลดข้อมูลสดจากระบบจีทู (กลิ่น/ราคา) + ค่าปรับแต่งจากหลังบ้านเมนู แล้วค่อยวาดหน้า ──
(async function init(){
  try{
    const md=await (await fetch(W+"/menudata",{signal:AbortSignal.timeout(6000)})).json();
    const F=md.flavors||{}, cfg=(md.cfg&&md.cfg.models)||{};
    for(const c of CATS) for(const m of G[c]){
      if(F[m.n]){
        if(Array.isArray(F[m.n].f)&&F[m.n].f.length) m.f=[...new Set(F[m.n].f)];
        if(F[m.n].p) m.p=F[m.n].p;
      }
      const o=cfg[m.n]||{};
      if(o.p) m.p=o.p;
      const D=DESC[m.n]||(DESC[m.n]={});
      if(o.tag){ D.tag=o.tag; delete TAGIMG[m.n]; }
      if(o.use) D.use=o.use;
      if(o.puff) D.puff=o.puff;
      if(o.promo) m.promo=o.promo;
      if(o.hide) m.hide=true;
      if(o.tagimg) TAGIMG[m.n]=W+"/menuimg/"+encodeURIComponent(o.tagimg);
      if(o.img) IMG[m.id]=W+"/menuimg/"+encodeURIComponent(o.img);
    }
  }catch(e){}
  build(); loadStock(); buildIndex();
})();
// ── ค้นหา ──
let IDX=[];
function buildIndex(){
  IDX=[];
  for(const c of CATS) for(const m of G[c]){ if(m.hide) continue; IDX.push({c,ci:CATS.indexOf(c),n:m.n,id:m.id,p:m.p,f:m.f}); }
}
const qEl=document.getElementById("q"),qr=document.getElementById("qres");
qEl.addEventListener("input",()=>{
  const q=qEl.value.trim().toLowerCase();
  if(q.length<2){ qr.style.display="none"; qr.innerHTML=""; return; }
  const out=[];
  for(const it of IDX){
    const nameHit=it.n.toLowerCase().includes(q);
    const fs=it.f.filter(f=>f.toLowerCase().includes(q));
    if(nameHit||fs.length) out.push({it,fs:nameHit?[]:fs.slice(0,4)});
    if(out.length>=12) break;
  }
  qr.innerHTML=out.length?out.map(o=>'<div class="qitem" onclick="jump('+o.it.ci+','+o.it.id+')"><b>'+o.it.n+' · '+o.it.p.toLocaleString()+'.-</b><small>'+(o.fs.length?("กลิ่น: "+o.fs.join(", ")):o.it.c)+'</small></div>').join(""):'<div class="qnone">ไม่พบ "'+qEl.value.trim()+'" ลองคำอื่นดูนะคะ</div>';
  qr.style.display="block";
});
function jump(ci,id){
  qr.style.display="none";
  go("p"+ci);
  setTimeout(()=>{
    const el=document.querySelector('#p'+ci+' .model[data-id="'+id+'"]');
    if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.add("hl"); setTimeout(()=>el.classList.remove("hl"),3500); }
  },80);
}
// ── กดกลิ่นเพื่อสั่ง ──
let SHEETMSG="";
document.getElementById("pages").addEventListener("click",ev=>{
  const ch=ev.target.closest(".chip"); if(!ch) return;
  const md=ch.closest(".model"); if(!md) return;
  const model=md.querySelector(".mhead b").textContent;
  const flavor=ch.title||ch.querySelector(".t").textContent;
  const inStock=ch.classList.contains("in");
  document.getElementById("sh_m").textContent=model;
  document.getElementById("sh_f").textContent=flavor;
  document.getElementById("sh_st").textContent=inStock?"✅ มีของพร้อมส่ง":"⛔ กลิ่นนี้หมดชั่วคราว — เลือกกลิ่นอื่น หรือสอบถามในแชทได้ค่ะ";
  SHEETMSG="สนใจ "+model+" กลิ่น"+flavor+" ค่ะ";
  document.getElementById("sh_msg").textContent=SHEETMSG;
  document.getElementById("sh_ok").textContent="";
  document.getElementById("sheetbg").style.display="block";
  document.getElementById("sheet").classList.add("on");
});
function closeSheet(){ document.getElementById("sheet").classList.remove("on"); document.getElementById("sheetbg").style.display="none"; }
async function orderGo(){
  try{ await navigator.clipboard.writeText(SHEETMSG); }
  catch(e){ const t=document.createElement("textarea"); t.value=SHEETMSG; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  document.getElementById("sh_ok").textContent="✅ คัดลอกแล้ว — กำลังพากลับแชท…";
  setTimeout(()=>{
    if(SHOPLINK[SHOP]){ location.href=SHOPLINK[SHOP]; return; }
    if(history.length>1) history.back();
    setTimeout(()=>{ try{window.close()}catch(e){} },350);
    setTimeout(()=>{ document.getElementById("sh_ok").textContent="✅ คัดลอกข้อความแล้วค่ะ — กดปุ่ม ✕ มุมบน เพื่อกลับแชท แล้ววางข้อความส่งได้เลย"; },800);
  },700);
}
