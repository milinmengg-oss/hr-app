<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ABC Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Kanit',sans-serif;background:#0a0a0c;color:#fff}
.page{display:none;min-height:100vh;max-width:520px;margin:0 auto}
.page.on{display:block}
/* ══ ปก (ขาวแบบ Canva หน้า 1) ══ */
#home{background:linear-gradient(160deg,#fdfdfd,#ececec);text-align:center;padding:36px 20px 46px;color:#111}
.logo{font-size:64px;font-weight:900;letter-spacing:1px;background:linear-gradient(115deg,#8ef05e,#37c86f 26%,#111 55%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
#home h1{font-size:30px;font-weight:900;margin-top:4px}
.instr{display:inline-block;border:1.5px solid #111;border-radius:8px;padding:5px 16px;font-size:12.5px;margin-top:12px}
.live{display:inline-flex;align-items:center;gap:7px;margin-top:12px;background:#eef7ee;border:1px solid #bfe3c6;border-radius:99px;padding:5px 14px;font-size:12px;color:#1d7c3d}
.live .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.35}}
.catlist{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.catbtn{display:flex;align-items:center;gap:12px;background:#0f1114;color:#fff;border-radius:12px;padding:13px 18px;font-size:16.5px;font-weight:800;cursor:pointer;border:none;font-family:inherit;text-align:left}
.catbtn .ic{font-size:18px}
.catbtn .arr{margin-left:auto;background:#fff;color:#111;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.homefoot{font-size:10.5px;color:#8a8a8a;margin-top:26px;line-height:1.8}
/* ══ หน้าหมวด (เข้มแบบ Canva) ══ */
.cpage{background:#0a0a0c}
.banner{position:sticky;top:0;z-index:10;background:linear-gradient(100deg,#15171c 45%,#2e333d);display:flex;align-items:center;padding:15px 16px;gap:10px;border-bottom:1px solid #23252b}
.banner h2{font-size:26px;font-weight:900;color:#fff}
.banner .abc{font-weight:900;font-size:14px;color:#8ef05e;margin-left:2px}
.back{margin-left:auto;background:#fff;color:#111;border:none;border-radius:9px;padding:8px 13px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.body{padding:14px 12px 92px}
.model{margin-top:20px}
.mhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:0 2px}
.mhead b{font-size:19px;font-weight:900;letter-spacing:.4px;font-style:italic}
.price{background:#c6f45f;color:#111;font-weight:900;font-size:14px;border-radius:99px;padding:2px 12px}
.oos{font-size:10.5px;color:#ff9d9d;background:#331414;border:1px solid #5d2727;border-radius:99px;padding:2px 10px}
.havecnt{font-size:10.5px;color:#9fe6b4;background:#122612;border:1px solid #2b5c38;border-radius:99px;padding:2px 10px}
.mbox{display:flex;gap:9px;margin-top:9px;background:#101014;border:1px solid #202026;border-radius:14px;padding:10px}
.chips{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;align-content:start}
.chip{font-size:11.5px;text-align:center;padding:7px 5px;border-radius:99px;background:#26262c;border:1px solid #35353d;color:#c9c9d1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.in{background:#f5f5f6;border-color:#fff;color:#111;font-weight:700}
.imgcard{width:42%;flex-shrink:0;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:8px;min-height:170px}
.imgcard img{width:100%;max-height:230px;object-fit:contain}
.noimg{color:#bbb;font-size:11px}
.note{font-size:12px;color:#7c7c85;margin-top:6px;padding:0 2px}
.legend{display:flex;gap:16px;justify-content:center;font-size:11.5px;color:#8b8b93;margin-top:18px}
.lg{display:flex;align-items:center;gap:6px}
.sw{width:15px;height:15px;border-radius:6px}
/* แถบล่าง */
.bar{position:fixed;left:0;right:0;bottom:0;background:#0d0d10f5;border-top:1px solid #232329;z-index:20;backdrop-filter:blur(8px)}
.bar .in{max-width:520px;margin:0 auto;display:flex;gap:9px;padding:9px 12px calc(9px + env(safe-area-inset-bottom))}
.bar a,.bar button{flex:1;text-align:center;border-radius:12px;padding:12px;font-weight:800;font-size:14px;text-decoration:none;border:none;font-family:inherit;cursor:pointer}
.b1{background:#c6f45f;color:#111}
.b2{background:#232329;color:#fff;border:1px solid #33333b}
</style>
</head>

</div>

  cl.insertAdjacentHTML("beforeend",'<button class="catbtn" onclick="go(\''+id+'\')"><span class="ic">'+ICON[c]+'</span>'+c+'<span class="arr">›</span></button>');
  let h='<div class="page cpage" id="'+id+'"><div class="banner"><h2>'+c+'</h2><span class="abc">ABC</span><button class="back" onclick="go(\'home\')">‹‹ กลับสู่หน้าหลัก</button></div><div class="body">';
  G[c].forEach(m=>{
    const im=IMG[m.id]?'<div class="imgcard"><img loading="lazy" src="'+IMG[m.id]+'" onerror="this.parentElement.innerHTML=\'<span class=noimg>ABC</span>\'"></div>':"";
    h+='<div class="model" data-id="'+m.id+'"><div class="mhead"><b>'+m.n+'</b><span class="price">'+m.p.toLocaleString()+'.-</span><span class="havecnt" style="display:none"></span><span class="oos" style="display:none">หมดทุกกลิ่น</span></div>';
    if(m.f.length) h+='<div class="mbox"><div class="chips">'+m.f.map(f=>'<span class="chip" data-f="'+norm(f)+'" title="'+f+'">'+f+"</span>").join("")+'</div>'+im+'</div>';
    else h+='<div class="mbox">'+ (im||'') +'<div class="note" style="align-self:center">ไม่มีตัวเลือกกลิ่น/สี</div></div>';
    h+="</div>";
  });
  h+='<div class="legend"><span class="lg"><span class="sw" style="background:#f5f5f6"></span>มีของ</span><span class="lg"><span class="sw" style="background:#26262c;border:1px solid #3a3a42"></span>หมดชั่วคราว</span></div></div></div>';
  pg.insertAdjacentHTML("beforeend",h);
});
function go(id){ document.querySelectorAll(".page").forEach(p=>p.classList.remove("on")); document.getElementById(id).classList.add("on"); document.getElementById("backbtn").style.display=(id==="home")?"none":"block"; scrollTo(0,0); }
fetch(W+"/flavors").then(r=>r.json()).then(st=>{
  document.querySelectorAll(".model").forEach(md=>{
    const id=md.dataset.id; let have=0,tot=0;
    md.querySelectorAll(".chip").forEach(ch=>{ tot++; if(st[id+"|"+ch.dataset.f]===false){} else { ch.classList.add("in"); have++; } });
    if(tot){ if(have){ const hc=md.querySelector(".havecnt"); hc.textContent="มีของ "+have+" กลิ่น"; hc.style.display="inline-block"; } else md.querySelector(".oos").style.display="inline-block"; }
  });
  document.getElementById("livetxt").textContent="สต็อกสด · อัปเดต "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" น.";
}).catch(()=>{ document.querySelectorAll(".chip").forEach(ch=>ch.classList.add("in")); document.getElementById("livetxt").textContent="แสดงรายการสินค้า"; });
</script>
</body>
</html>
