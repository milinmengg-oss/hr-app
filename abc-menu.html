<title>ABC — เมนูสินค้า</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Kanit',sans-serif;background:#0b0b0d;color:#f2f2f2}
.wrap{max-width:520px;margin:0 auto;padding:0 12px 90px}
/* ปก */
.hero{text-align:center;padding:34px 0 18px}
.logo{font-size:44px;font-weight:800;letter-spacing:2px;background:linear-gradient(120deg,#8ef05e,#3ddc84 30%,#f2f2f2 60%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero h1{font-size:22px;font-weight:800;margin-top:2px}
.live{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:#121812;border:1px solid #234c2e;border-radius:99px;padding:6px 14px;font-size:12px;color:#8fe6a8}
.live .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84;animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.35}}
/* สารบัญ */
.idx{display:flex;flex-direction:column;gap:8px;margin:16px 0 8px}
.idx a{display:flex;align-items:center;gap:11px;background:#111114;border:1px solid #232328;border-radius:14px;padding:12px 16px;color:#fff;text-decoration:none;font-weight:600;font-size:15px}
.idx a small{margin-left:auto;color:#6f6f77;font-weight:400;font-size:12px}
/* หมวด */
.sec{margin-top:30px;scroll-margin-top:64px}
.sechead{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;padding:10px 2px;border-bottom:2px solid #26262c;position:sticky;top:0;background:#0b0b0dee;backdrop-filter:blur(6px);z-index:5}
.sechead a{margin-left:auto;font-size:11.5px;color:#8a8a92;text-decoration:none;font-weight:400}
/* การ์ดรุ่น */
.md{background:#111114;border:1px solid #232328;border-radius:16px;padding:14px 14px 12px;margin-top:12px}
.mh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.mh b{font-size:16.5px}
.price{background:#c6f45f;color:#111;font-weight:800;font-size:13.5px;border-radius:8px;padding:2px 9px}
.oos-model{font-size:11.5px;color:#ff8f8f;background:#2a1414;border:1px solid #512626;border-radius:99px;padding:2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;padding:5px 11px;border-radius:99px;background:#1d1d22;border:1px solid #33333a;color:#e8e8ec}
.chip.out{opacity:.28;text-decoration:line-through;text-decoration-thickness:1px}
.note{font-size:11.5px;color:#6f6f77;margin-top:9px}
/* แถบล่าง */
.bar{position:fixed;left:0;right:0;bottom:0;background:#0e0e11f2;border-top:1px solid #232328;backdrop-filter:blur(8px);z-index:20}
.bar .in{max-width:520px;margin:0 auto;display:flex;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar a{flex:1;text-align:center;border-radius:13px;padding:12px;font-weight:800;font-size:14.5px;text-decoration:none}
.b1{background:#c6f45f;color:#111}
.b2{background:#1d1d22;color:#fff;border:1px solid #33333a}
.top{position:fixed;right:14px;bottom:84px;width:42px;height:42px;border-radius:50%;background:#1d1d22;border:1px solid #33333a;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px;z-index:20}
.foot{margin-top:34px;text-align:center;font-size:11px;color:#55555c;line-height:1.8}
</style>
</head>

  const now=new Date();
  document.getElementById("livetxt").textContent="สต็อกสด · อัปเดต "+now.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" น.";
}).catch(()=>{ document.getElementById("livetxt").textContent="แสดงรายการสินค้า (เช็คสต็อกสดไม่สำเร็จ)"; });
</script>
