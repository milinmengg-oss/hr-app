/* อัตราส่วน กว้าง:สูง ของจุดกด — แคปซูลกลิ่นจะยาวมาก ไทล์รูปสินค้าจะเกือบจตุรัส
   ใช้ 560px คือความกว้างสูงสุดของหน้าจอเมนู ส่วนสูงคำนวณจากสัดส่วนภาพรวมของหน้านั้น */
function ratio(sp){
  const g=(CFG.img[sp._p]||[]);
  let totH=0; g.forEach(x=>{ totH += 1/(+x.r||1); });
  if(!totH) return 99;
  return (sp.w/100) / ((sp.h/100)*totH);
}
/* ความเข้มฝ้ารายหน้า — หน้าที่ไม่อยู่ในลิสต์ใช้ 85% (ดู .hot.out ใน CSS) · f90 = 90% */
const FOG={"09":"f90","10":"f90"};
/* เลขกันแคชภาพ — เปลี่ยนทุกครั้งที่อัปภาพชุดใหม่ (ชื่อไฟล์เดิม) ไม่งั้นมือถือลูกค้าจะเห็นภาพเก่าค้างแต่ฝ้าย้ายไปแล้ว
   ภาพหน้าแรกอยู่ใน <img ... 00.jpg?v=..> ด้านบน ต้องเปลี่ยนเลขให้ตรงกันด้วย */
const IMGV="76";
function openCat(cat){
  CATNOW=cat;
  const pages=CFG.pages[cat]||[];
  const box=document.getElementById("catpages");
  box.innerHTML="";
  if(!pages.length){
    box.innerHTML='<div class="soon"><b>'+cat+'</b>หมวดนี้กำลังเตรียมไฟล์ภาพอยู่<br>สอบถามสินค้าในหมวดนี้ผ่านแชทไลน์ได้เลยค่ะ</div>';
  } else {
    pages.forEach(p=>{
      const s=document.createElement("div"); s.className="stage";
      s.innerHTML=(CFG.img[p]||[]).map(function(g,gi){
        return '<img class="base" decoding="async"'+(gi?' loading="lazy"':' fetchpriority="high"')+' src="img/menu4/'+g.s+'?v='+IMGV+'"'
             + ' style="aspect-ratio:'+g.r+'" alt="'+cat+'">';}).join("");
      (CFG.spots[p]||[]).forEach((sp,i)=>{
        sp._p=p;
        const d=document.createElement("div");
        /* rx/ry มาจากการวัดขอบจริงในภาพต้นฉบับ ถ้ามีให้ใช้ก่อน ไม่มีค่อยเดาจากสัดส่วน */
        const hasR = (sp.rx!==undefined && sp.ry!==undefined);
        d.className="hot"+(sp.w<4.5?" sm":"")+(hasR?"":(ratio(sp)<2.2?" tile":""))
                  +(sp.g?" grey":"")+(sp.nf?" nf":"")+(FOG[p]?" "+FOG[p]:"");
        /* rx=ry=50 คือชิปทรงแคปซูล ต้องใช้ 999px ไม่ใช่ 50%
           เพราะ border-radius:50%/50% บนกล่องสี่เหลี่ยมผืนผ้าจะกลายเป็น "วงรี"
           ปลายสองข้างจะไม่ถูกคลุม เห็นเนื้อชิปสีดำโผล่เป็นเสี้ยว */
        const cap = hasR && sp.rx===50 && sp.ry===50;
        d.style.cssText=`left:${sp.x}%;top:${sp.y}%;width:${sp.w}%;height:${sp.h}%`
          + (cap?";border-radius:999px":(hasR?`;border-radius:${sp.rx}% / ${sp.ry}%`:""));
        d.dataset.p=p; d.dataset.i=i;
        d.onclick=()=>openSheet(p,i);
        s.appendChild(d);
      });
      box.appendChild(s);
    });
  }
  document.getElementById("v_home").classList.remove("on");
  document.getElementById("v_cat").classList.add("on");
  document.getElementById("backbar").classList.add("on");
  scrollTo(0,0); paintStock();
  if(typeof reviewPaint==="function") reviewPaint();
  if(typeof cartPaint==="function") cartPaint();
}

function goHome(){
  document.getElementById("v_cat").classList.remove("on");
  document.getElementById("v_home").classList.add("on");
  document.getElementById("backbar").classList.remove("on");
  document.getElementById("cartbar").classList.remove("on");   /* แถบรายการโชว์เฉพาะตอนดูหมวด */
  scrollTo(0,0);
}

function cacheStock(raw){ try{ localStorage.setItem("abc_stock", JSON.stringify({t:Date.now(),d:raw})); }catch(e){} }
function useCachedStock(){
  try{
    const c=JSON.parse(localStorage.getItem("abc_stock")||"null");
    if(!c || Date.now()-c.t > 600000) return false;
    applyStock(c.d);
    document.getElementById("livetxt").textContent="กำลังอัปเดตสต็อก…";
    return true;
  }catch(e){ return false; }
}
function applyStock(raw){
  const st={}; TRACKED=new Set();
  for(const k in raw){ const i=k.indexOf("|"); if(i<0) continue;
    const mn=k.slice(0,i); st[mn+"|"+norm(k.slice(i+1))]=raw[k]; TRACKED.add(mn); }
  STOCK=st; paintStock();
}
function loadStock(){
  useCachedStock();
  fetch(W+"/menustock").then(r=>r.json()).then(raw=>{
    applyStock(raw); cacheStock(raw);
    document.getElementById("livetxt").textContent=
      "สต็อกสด · อัปเดต "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" น.";
  }).catch(()=>{ document.getElementById("livetxt").textContent="แสดงรายการสินค้า"; });
}

  /* ── ปิดถาวร: เลิกขาย รอกราฟิกเอาออกจาก artwork แล้วลบจุดกดทิ้ง ── */
  "เครื่อง DUAL SMASH|",                 /* 22/09 เลิกขาย */
  "เครื่อง VAZER RELOAD|"                /* 22/09 เลิกขาย */
]);
function spOK(sp){
  const SF=(sp.sk!==undefined?sp.sk:sp.f);            /* sk = คีย์สต็อกจริง (ใช้เมื่อ artwork แยกช่องแต่ระบบมีคีย์เดียว) */
  if(FORCE_OUT.size && FORCE_OUT.has(sp.m+"|"+norm(SF))) return false;
  const v=STOCK?STOCK[sp.m+"|"+norm(SF)]:undefined, q=qtyOf(sp);
  if(v===undefined&&q===null) return true;          // ไม่มีข้อมูล = ไม่ตัดสิน
  return (v!==undefined)?(v===true):(q>0);
}
function findAll(t){ return IDX.filter(o=>t.every(x=>o.k.indexOf(x)>=0)); }
// พิมพ์ติดกันไม่เว้นวรรคก็ได้ เช่น "มาโบองุ่น" → ระบบตัดคำให้เอง
function smartFind(q){
  const t=q.split(" ").filter(Boolean);
  let r=findAll(t); if(r.length) return r;
  const last=t[t.length-1]||"", head=t.slice(0,-1);
  for(let i=2;i<=last.length-2;i++){
    const c=findAll(head.concat([last.slice(0,i),last.slice(i)]));
    if(c.length) return c;
  }
  for(let i=2;i<=last.length-4;i++) for(let j=i+2;j<=last.length-2;j++){
    const c=findAll(head.concat([last.slice(0,i),last.slice(i,j),last.slice(j)]));
    if(c.length) return c;
  }
  return [];
}
function doSearch(){
  const box=document.getElementById("qres");
  const q=norm(document.getElementById("q").value);
  if(q.length<2){ box.classList.remove("on"); box.innerHTML=""; return; }
  let r=smartFind(q);
  r.forEach(o=>o.ok=spOK(CFG.spots[o.p][o.i]));
  r.sort((a,b)=>(b.ok-a.ok)||a.m.localeCompare(b.m,"th")||a.f.localeCompare(b.f,"th"));
  box.classList.add("on");
  if(!r.length){ box.innerHTML='<div class="qn">ไม่พบ "'+document.getElementById("q").value+'"<br>ลองพิมพ์ชื่อรุ่นหรือชื่อกลิ่นสั้น ๆ</div>'; return; }
  const has=r.filter(o=>o.ok).length;
  let h='<div class="qn" style="padding:9px 13px;text-align:left;border-bottom:1px solid #f1f1f1">พบ '+r.length+' รายการ · มีของ '+has+'</div>';
  r.slice(0,80).forEach(o=>{
    h+='<div class="qi" data-p="'+esc(o.p)+'" data-i="'+o.i+'"><div class="qt">'
      +'<div class="qm">'+esc(o.m)+'</div><div class="qf">'+esc(o.f)+'</div></div>'
      +'<span class="qb '+(o.ok?'ok':'no')+'">'+(o.ok?'มีของ':'หมด')+'</span></div>';

  if(r.length>80) h+='<div class="qn">แสดง 80 จาก '+r.length+' รายการ — พิมพ์เพิ่มเพื่อกรองให้แคบลง</div>';
  box.innerHTML=h;
}

  const S=CFG.stock; if(!S) return null;
  const v=S[sp.m+"|"+norm(sp.sk!==undefined?sp.sk:sp.f)];
  return (v===undefined)?null:v;

// ── รายการที่เลือก (ตะกร้า) ────────────────────────────────
/* เก็บในหน่วยความจำอย่างเดียว — ปิดหน้าแล้วหาย ไม่ค้างข้ามวันให้สับสน
   ฟอร์แมตข้อความตามสเปกห้องจีทู: 1 รายการ=1 บรรทัด · ชื่อรุ่นเต็มทุกบรรทัด
   · ชื่อกลิ่นเต็มห้ามย่อ · จำนวนท้ายบรรทัดเสมอ (xN) · ห้ามใส่ราคา · ปิดท้าย "รวม N ชิ้น" */
let CART=[];   // [{p,i,m,f,q}]
const cartKey=sp=>sp.m+"|"+norm(sp.sk!==undefined?sp.sk:sp.f);
function cartFind(sp){ const k=cartKey(sp); return CART.find(c=>c.m+"|"+norm(c.f)===k); }
function cartLine(c){
  const isColor=c.f.startsWith("สี")||c.f==="";
  const name=(c.f==="")?c.m:(c.m+(isColor?" ":" กลิ่น ")+c.f);
  return name+" x"+c.q;
}
function cartText(){
  const lines=CART.map(cartLine);
  const n=CART.reduce((a,c)=>a+c.q,0);
  return lines.join("\n")+"\nรวม "+n+" ชิ้น";
}
function cartCount(){ return CART.reduce((a,c)=>a+c.q,0); }
function cartPaint(){
  const n=cartCount();
  const bar=document.getElementById("cartbar");
  bar.classList.toggle("on", n>0 && document.getElementById("v_cat").classList.contains("on"));
  document.getElementById("bcart").textContent="🧾 ดูรายการที่เลือก ("+n+")";
  const box=document.getElementById("cartlist");
  box.innerHTML=CART.map((c,ix)=>{
    const isColor=c.f.startsWith("สี")||c.f==="";
    return '<div class="ci"><div class="t"><div class="m">'+esc(c.m)+'</div>'
      +(c.f?'<div class="f">'+esc(isColor?c.f:("กลิ่น "+c.f))+'</div>':'')
      +'</div><div class="c"><button data-a="m" data-x="'+ix+'" type="button">−</button>'
      +'<span>'+c.q+'</span><button data-a="p" data-x="'+ix+'" type="button">+</button></div>'
      +'<button class="rm" data-a="r" data-x="'+ix+'" type="button">ลบ</button></div>';
  }).join("") || '<div style="padding:22px 6px;text-align:center;color:#999;font-size:13.5px">ยังไม่ได้เลือกสินค้า</div>';
  document.getElementById("carttot").textContent = n? ("รวม "+n+" ชิ้น") : "";
  /* เตือนถ้าของในรายการหมดระหว่างเลือก (สต็อกอัปเดตทุก 2 นาที) */
  const gone=CART.filter(c=>{const sp=CFG.spots[c.p][c.i]; return !spOK(sp);}).map(c=>c.m+(c.f?" "+c.f:""));
  const w=document.getElementById("cartwarn");
  if(gone.length){ w.style.display="block"; w.textContent="⚠️ สินค้าต่อไปนี้เพิ่งหมด: "+gone.join(" · ")+" — กดลบออกก่อนคัดลอกนะคะ"; }
  else w.style.display="none";
}
function cartAdd(sp,p,i){
  const c=cartFind(sp);
  if(c) c.q++; else CART.push({p:p,i:i,m:sp.m,f:sp.f,q:1});
  cartPaint(); sheetQty(sp);
}
function sheetQty(sp){
  const c=cartFind(sp);
  document.getElementById("sh_qty").style.display = c? "flex":"none";
  document.getElementById("badd").style.display  = c? "none":"block";
  if(c) document.getElementById("qn").textContent=c.q;
}
function openCart(){ cartPaint(); document.getElementById("cart_ok").textContent="";

  document.getElementById("cartsheet").classList.add("on"); }
function closeCart(){ document.getElementById("cartsheet").classList.remove("on");
  document.getElementById("sheetbg").style.display="none"; }
async function cartCopy(){
  if(!CART.length) return;
  const t=cartText();
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  document.getElementById("cart_ok").textContent="✅ คัดลอกแล้ว — กลับไปที่แชทไลน์ แล้ววางข้อความส่งได้เลย";
}
function bindCart(){
  document.getElementById("bcart").addEventListener("click",openCart);
  document.getElementById("bcartcls").addEventListener("click",closeCart);
  document.getElementById("bcopyall").addEventListener("click",cartCopy);
  document.getElementById("badd").addEventListener("click",function(){
    if(!SP) return; cartAdd(SP,SP._p,SP._i);
  });
  document.getElementById("qp").addEventListener("click",function(){ if(SP) cartAdd(SP,SP._p,SP._i); });
  document.getElementById("qm").addEventListener("click",function(){
    if(!SP) return; const c=cartFind(SP); if(!c) return;
    c.q--; if(c.q<=0) CART=CART.filter(x=>x!==c);
    cartPaint(); sheetQty(SP);
  });
  document.getElementById("cartlist").addEventListener("click",function(ev){
    const b=ev.target.closest("button[data-a]"); if(!b) return;
    const ix=+b.dataset.x, c=CART[ix]; if(!c) return;
    if(b.dataset.a==="p") c.q++;
    else if(b.dataset.a==="m"){ c.q--; if(c.q<=0) CART.splice(ix,1); }
    else CART.splice(ix,1);
    cartPaint();
    if(SP) sheetQty(SP);
    if(!CART.length) document.getElementById("cart_ok").textContent="";
  });
}

const REV_ALIAS={                              /* ชื่อในชีต (normalize แล้ว) → ชื่อรุ่นในเมนู */
  "หัวน้ำยา":{"relxinfinity":"หัวพอต RELX INFINITY","relxlarge":"หัวพอต RELX LARGE","relxultrapod":"หัวพอต RELX ULTRA",
    "infyplus":"หัวพอต INFY PLUS","marbozeropod":"หัวพอต MARBO ZERO","kslumina2":"หัวพอต KS LUMINA 2"},
  "Big Pod":{"relxclear18k":"RELX POD CLEAR 18K","relxboost20k":"RELX BOOST POD","mswitch15k":"M SWITCH"},
  "ใช้แล้วทิ้ง":{"stars25k":"STAR 2,500","marbo9kโคลน":"MARBO 9K (โคลน)","vplus16k":"V PLUS 16K",
    "joiwayf420k":"JOIWAY TWINS 20K","garamdoreme6k":"GARAM 6K"},
  "Big Pod Kit":{"vazerreload15k":"VAZER RELOAD 15K (KIT)","mswitchkit15k":"M SWITCH 15K (KIT)",
    "eskobarswitchkit20k":"ESKO BAR SWITCH 20K (KIT)"}
};
let REV_ROWS=null, REV_AT=0, CATNOW="";
function revNorm(s){ return String(s||"").toLowerCase().replace(/[^a-z0-9฀-๿]/g,""); }
function revCSV(t){                            /* CSV parser รองรับเครื่องหมายคำพูดและขึ้นบรรทัดใหม่ในช่อง */
  const R=[]; let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){c+='"';i++;} else q=false; } else c+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){ r.push(c); c=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&t[i+1]==="\n") i++; r.push(c); c=""; R.push(r); r=[]; }
    else c+=ch; }
  if(c!==""||r.length){ r.push(c); R.push(r); }
  return R;
}
const REV_YT=/https?:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:shorts\/|watch\?[^\s]*?v=|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})[^\s"',]*/gi;
function revLatestLink(cell){                  /* หลายลิงก์ในช่องเดียว = ใช้ลิงก์ท้ายสุด (เผยแพร่ล่าสุด) */
  const m=String(cell||"").match(REV_YT); return (m&&m.length)?m[m.length-1]:null;
}
function revParse(text){
  const R=revCSV(text); let hi=-1, col={};
  const need={cat:"ประเภทสินค้า",name:"รายการสินค้า",pub:"Status การเผยแพร่",link:"Links รีวิว",sale:"สถานะการขาย"};
  for(let i=0;i<R.length&&i<60;i++){
    const t=R[i].map(x=>String(x||"").trim()); const f={};
    for(const k in need){ const j=t.indexOf(need[k]); if(j>=0) f[k]=j; }
    if(Object.keys(f).length===5){ hi=i; col=f; break; }
  }
  if(hi<0) return null;                        /* โครงสร้างชีตไม่ตรง → ไม่ทำอะไร */
  const out=[];
  for(let i=hi+1;i<R.length;i++){ const r=R[i];
    out.push({cat:String(r[col.cat]||"").trim(), name:String(r[col.name]||"").trim(), pub:String(r[col.pub]||"").trim(),
              link:revLatestLink(r[col.link]), sale:String(r[col.sale]||"").trim().toLowerCase(), order:i}); }
  return out;
}
/* คืน {หน้า:{ชื่อรุ่นในเมนู:ลิงก์}} จากแถวที่ผ่านเงื่อนไขครบ · มีหลายแถวของรุ่นเดียวกัน = แถวท้ายสุดที่ผ่านเงื่อนไข */
function revBuild(rows){
  const res={};
  if(!rows) return res;
  for(const p in REV_PAGES){
    const models=Object.keys((CFG.hero&&CFG.hero[p])||{}); const idx={};
    models.forEach(m=>idx[revNorm(m)]=m);
    const al=REV_ALIAS[REV_PAGES[p]]||{}; res[p]={};
    rows.forEach(r=>{
      if(r.cat!==REV_PAGES[p]) return;
      if(r.sale!=="active" || r.pub!=="ลงแล้ว" || !r.link) return;
      const n=revNorm(r.name); const m=al[n]||idx[n]; if(!m||!(CFG.hero[p][m])) return;
      res[p][m]=r.link;
    });
  }
  return res;
}
function reviewPaint(){
  if(REV_CSV_URL && Date.now()-REV_AT>300000) loadReviews();   /* รีเฟรชข้อมูลทุก 5 นาทีเมื่อเปิดหมวด */
  document.querySelectorAll("#catpages .rv").forEach(x=>x.remove());
  const map=revBuild(REV_ROWS);
  document.querySelectorAll("#catpages .stage").forEach((st,si)=>{
    const p=(CFG.pages[CATNOW]||[])[si]; if(!p||!map[p]) return;
    for(const m in map[p]){ const b=CFG.hero[p][m];
      const a=document.createElement("a"); a.className="rv"; a.href=map[p][m]; a.target="_blank"; a.rel="noopener noreferrer";
      a.setAttribute("aria-label","ดูวิดีโอรีวิว "+m);
      a.style.cssText="left:"+b.x+"%;top:"+b.y+"%;width:"+b.w+"%;height:"+b.h+"%";
      a.innerHTML='<img src="img/menu4/play_v76.png?v='+IMGV+'" alt="กดเพื่อดูวิดีโอรีวิว" draggable="false">';
      st.appendChild(a); }
  });
}
function applyReviews(rows){ REV_ROWS=rows; reviewPaint(); }   /* ใช้ตอนทดสอบ/รีเฟรชข้อมูล */
function loadReviews(){
  REV_AT=Date.now();
  try{
    if(REV_CSV_URL){
      fetch(REV_CSV_URL+(REV_CSV_URL.indexOf("?")<0?"?":"&")+"t="+Date.now()).then(r=>{ if(!r.ok) throw 0; return r.text(); })
        .then(t=>applyReviews(revParse(t))).catch(()=>applyReviews(null));
    } else if(REV_USE_SNAPSHOT){ applyReviews(revParse(REV_SNAPSHOT)); }
  }catch(e){ applyReviews(null); }
}

   ตามสต็อกจริง = ฝ้าตามสต็อกสด (ค่าเริ่มต้น) · ฝ้าทุกจุด = ไว้ให้กราฟิกเช็กว่าฝ้าคลุมพอดีทุกช่อง · ปิดฝ้า = ดูภาพเต็ม ── */
