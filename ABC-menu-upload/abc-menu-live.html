/* ที่เว้นกันปุ่มลอยบังเนื้อหา — สี #111111 เดียวกับแถบปุ่ม มองเป็นผืนเดียว */
.topbar{position:sticky;top:0;z-index:12}
.live{display:none;background:#0b0b0b;color:#c6f45f;font-size:11.5px;text-align:center;padding:6px 10px;font-weight:700}
.topbar.dbg .live{display:block}
.sbtn{background:#0b0b0b;padding:7px 10px 9px;display:flex;justify-content:center;cursor:pointer}
.sbtn img{height:34px;width:auto;display:block}
.sbtn:active img{opacity:.7}
.sbar{background:#0b0b0b;padding:9px 10px 13px;display:none;gap:8px;align-items:stretch}
.sbar.on{display:flex}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:#fff;border-radius:13px;
  padding:12px 14px;box-shadow:0 0 0 2.5px #c6f45f,0 6px 16px rgba(0,0,0,.45);transition:box-shadow .15s}
.sbox:focus-within{box-shadow:0 0 0 3px #c0ff00,0 0 18px rgba(192,255,0,.45),0 6px 16px rgba(0,0,0,.45)}
.sbox svg{flex:0 0 19px;stroke:#111;opacity:.75}
.sbar input{flex:1;min-width:0;border:none;background:transparent;color:#111;outline:none;
  font-size:16px;font-weight:700;font-family:inherit;padding:0}
.sbar input::placeholder{color:#a2a2a2;font-weight:500}
.sbar button{border:none;border-radius:13px;padding:0 17px;background:#c6f45f;color:#111;
  font-size:17px;font-weight:800;font-family:inherit;cursor:pointer}
.sbar button:active{background:#a9d94a}
#qres{display:none;background:#fff;max-height:64vh;overflow:auto;
  border-top:1px solid #2a2a2a;box-shadow:0 10px 22px rgba(0,0,0,.30)}
#qres.on{display:block}
.qi{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid #f1f1f1;cursor:pointer}
.qi:active{background:#f5f5f5}
.qt{flex:1;min-width:0}
.qm{font-size:11.5px;color:#8a8a8a;line-height:1.3}
.qf{font-size:14.5px;font-weight:700;color:#111;line-height:1.35}
.qb{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.qb.ok{background:#e6f6ea;color:#1d7c3d} .qb.no{background:#f0f0f0;color:#9a9a9a}
.qn{padding:18px 14px;color:#8a8a8a;font-size:13.5px;text-align:center;line-height:1.7}
.hot.flash{box-shadow:0 0 0 3px #ff3b3b,0 0 0 9px rgba(255,59,59,.30)}
.view{display:none}.view.on{display:block}

.stage{position:relative;line-height:0}
.stage img.base{width:100%;height:auto;display:block;
  /* ถอดรหัสเฉพาะภาพที่ใกล้จะเห็น — ลดการกระตุกตอนเลื่อนหน้ายาว ๆ */
  content-visibility:auto}
.hot{position:absolute;border-radius:999px;cursor:pointer}

.hot.tile{border-radius:4.2%/2.2%}
/* หน้าที่วัดขอบจากภาพต้นฉบับแล้ว จะกำหนด border-radius รายจุดทับค่าข้างบน
   (ค่า rx/ry ใน CFG = รัศมีจริงคิดเป็น % ของกว้าง/สูงของจุดนั้น จึงกลมพอดีทุกขนาดจอ) */

  box-shadow:0 0 0 1.5px rgba(255,255,255,.88)}   /* ของหมด = ฝ้าขาวโปร่งแสง ตามเรฟกราฟิก */

   ไม่ใช้ box-shadow เพราะเงากว้างเป็น px คงที่ พอจอเล็กจะดูอ้วนล้นออกนอกชิป
   (เห็นชัดมากตรงแถบนิค 5 ที่พื้นหลังเป็นสีเขียวมิ้นต์ ไม่ใช่สีขาว)

function buildHome(){
  const st=document.getElementById("homestage");
  CFG.home.hot.forEach(h=>{
    const d=document.createElement("div");
    d.className="hot";
    d.style.cssText=`left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%`;
    d.onclick=()=>openCat(h.c);
    st.appendChild(d);
  });
}

/* อัตราส่วน กว้าง:สูง ของจุดกด — แคปซูลกลิ่นจะยาวมาก ไทล์รูปสินค้าจะเกือบจตุรัส
   ใช้ 560px คือความกว้างสูงสุดของหน้าจอเมนู ส่วนสูงคำนวณจากสัดส่วนภาพรวมของหน้านั้น */
function ratio(sp){
  const g=(CFG.img[sp._p]||[]);
  let totH=0; g.forEach(x=>{ totH += 1/(+x.r||1); });
  if(!totH) return 99;
  return (sp.w/100) / ((sp.h/100)*totH);
}
/* สีฝ้ารายหน้า ตามที่กราฟิกสั่ง — หน้าที่ไม่อยู่ในลิสต์นี้ใช้ค่าเดิมทั้งหมด
   fw = ขาว #FFFFFF · fe = #EFEFEF  (ทั้งคู่โปร่ง 88% เท่าเดิม) */
const FOG={"01":"fw","02":"fe","03":"fe","04":"fw","08":"fe"};
function openCat(cat){
  const pages=CFG.pages[cat]||[];
  const box=document.getElementById("catpages");
  box.innerHTML="";
  if(!pages.length){
    box.innerHTML='<div class="soon"><b>'+cat+'</b>หมวดนี้กำลังเตรียมไฟล์ภาพอยู่<br>สอบถามสินค้าในหมวดนี้ผ่านแชทไลน์ได้เลยค่ะ</div>';
  } else {
    pages.forEach(p=>{
      const s=document.createElement("div"); s.className="stage";
      s.innerHTML=(CFG.img[p]||[]).map(function(g,gi){
        return '<img class="base" decoding="async"'+(gi?' loading="lazy"':' fetchpriority="high"')+' src="img/menu4/'+g.s+'"'
             + ' style="aspect-ratio:'+g.r+'" alt="'+cat+'">';}).join("");
      (CFG.spots[p]||[]).forEach((sp,i)=>{
        sp._p=p;
        const d=document.createElement("div");
        /* rx/ry มาจากการวัดขอบจริงในภาพต้นฉบับ ถ้ามีให้ใช้ก่อน ไม่มีค่อยเดาจากสัดส่วน */
        const hasR = (sp.rx!==undefined && sp.ry!==undefined);
        d.className="hot"+(sp.w<4.5?" sm":"")+(hasR?"":(ratio(sp)<2.2?" tile":""))
                  +(sp.g?" grey":"")+(FOG[p]?" "+FOG[p]:"");
        /* rx=ry=50 คือชิปทรงแคปซูล ต้องใช้ 999px ไม่ใช่ 50%
           เพราะ border-radius:50%/50% บนกล่องสี่เหลี่ยมผืนผ้าจะกลายเป็น "วงรี"
           ปลายสองข้างจะไม่ถูกคลุม เห็นเนื้อชิปสีดำโผล่เป็นเสี้ยว */
        const cap = hasR && sp.rx===50 && sp.ry===50;
        d.style.cssText=`left:${sp.x}%;top:${sp.y}%;width:${sp.w}%;height:${sp.h}%`
          + (cap?";border-radius:999px":(hasR?`;border-radius:${sp.rx}% / ${sp.ry}%`:""));
        d.dataset.p=p; d.dataset.i=i;
        d.onclick=()=>openSheet(p,i);
        s.appendChild(d);
      });
      box.appendChild(s);
    });
  }
  document.getElementById("v_home").classList.remove("on");
  document.getElementById("v_cat").classList.add("on");
  document.getElementById("backbar").classList.add("on");
  scrollTo(0,0); paintStock();
}
function goHome(){
  document.getElementById("v_cat").classList.remove("on");
  document.getElementById("v_home").classList.add("on");
  document.getElementById("backbar").classList.remove("on");
  scrollTo(0,0);
}

// ── สต็อกสด: /menustock คีย์ "ชื่อรุ่น|กลิ่น" (normalize ตัวพิมพ์ให้ตรงกัน) ──
let PRICE=null;
function priceOf(m){ const p=(PRICE&&PRICE[m]!=null)?PRICE[m]:(CFG.price||{})[m]; return (p==null)?null:p; }
function loadPrice(){
  fetch(W+"/menudata").then(r=>r.json()).then(d=>{
    const p={}, f=d.flavors||{};
    const A={"ABC LEGO 20K (หัวน้ำยา)":"ABC LEGO 20K","ABC TANK 22K (หัวน้ำยา)":"ABC TANK 22K",
      "ELFBAR SWAP 25K (หัวน้ำยา)":"ELFBAR SWAP 25K","ESKO BAR SWITCH 20K (หัวน้ำยา)":"ESKO BAR SWITCH 20K",
      "KS QUIK PRO 15K (หัวน้ำยา)":"KS QUIK PRO 15K","หัวพอต M SWITCH":"M SWITCH",
      "หัวพอต RELX BOOST POD":"RELX BOOST POD","RELX POD CLEAR 18K (หัวน้ำยา)":"RELX POD CLEAR 18K",
      "VAZER RELOAD 15K (หัวน้ำยา)":"VAZER RELOAD 15K"};
    for(const mm in (CFG.price||{})){ const src=f[A[mm]||mm]; if(src&&src.p!=null) p[mm]=src.p; }
    PRICE=p;
  }).catch(()=>{});
}
/* จำสต็อกล่าสุดไว้ในเครื่อง 10 นาที — เปิดเมนูครั้งต่อไปปุ่มขึ้นทันทีระหว่างรอข้อมูลสด */
function cacheStock(raw){ try{ localStorage.setItem("abc_stock", JSON.stringify({t:Date.now(),d:raw})); }catch(e){} }
function useCachedStock(){
  try{
    const c=JSON.parse(localStorage.getItem("abc_stock")||"null");
    if(!c || Date.now()-c.t > 600000) return false;
    applyStock(c.d);
    document.getElementById("livetxt").textContent="กำลังอัปเดตสต็อก…";
    return true;
  }catch(e){ return false; }
}
function applyStock(raw){
  const st={}; TRACKED=new Set();
  for(const k in raw){ const i=k.indexOf("|"); if(i<0) continue;
    const mn=k.slice(0,i); st[mn+"|"+norm(k.slice(i+1))]=raw[k]; TRACKED.add(mn); }
  STOCK=st; paintStock();
}
function loadStock(){
  useCachedStock();
  fetch(W+"/menustock").then(r=>r.json()).then(raw=>{
    applyStock(raw); cacheStock(raw);
    document.getElementById("livetxt").textContent=
      "สต็อกสด · อัปเดต "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" น.";
  }).catch(()=>{ document.getElementById("livetxt").textContent="แสดงรายการสินค้า"; });
}
function bindUI(){
  const q=document.getElementById("q");
  ["input","keyup","change","search"].forEach(e=>q.addEventListener(e,doSearch));
  document.getElementById("qx").addEventListener("click",closeSearch);
  document.getElementById("sbtn").addEventListener("click",openSearch);
  document.getElementById("bhome").addEventListener("click",goHome);
  document.getElementById("sheetbg").addEventListener("click",closeSheet);
  document.getElementById("bcls").addEventListener("click",closeSheet);
  document.getElementById("bgo").addEventListener("click",orderGo);
  document.getElementById("qres").addEventListener("click",function(ev){
    const row=ev.target.closest(".qi"); if(!row) return;
    goSpot(row.dataset.p, +row.dataset.i);
  });
}

// ── ช่องค้นหาสินค้า ──────────────────────────────────────────
let IDX=[], CATOF={};
// คำอ่านไทยของชื่อแบรนด์ — พิมพ์ "มาโบ" ก็เจอ MARBO
const TH={marbo:"มาโบ มาร์โบ",relx:"รีแลค เรลเอ็กซ์ อาร์อีแอลเอ็กซ์",infy:"อินฟาย อินฟี่",
 esko:"เอสโก้ เอสโก",elfbar:"เอลฟ์บาร์ เอลบาร์ เอฟบาร์",iqos:"ไอคอส ไอโคส",garam:"การัม กะรัม การาม",
 vazer:"วาเซอร์ เวเซอร์",joiway:"จอยเวย์",twins:"ทวิน",carnival:"คาร์นิวัล คานิวัล",
 lana:"ลาน่า",iris:"ไอริส",vosoon:"โวซูน โวซุน",ks:"เคเอส",quik:"ควิก",insta:"อินสตา",
 star:"สตาร์",dual:"ดูอัล ดูออล",smash:"สแมช",saltnic:"ซอลนิค ซัลนิค เกลือ",
 freebase:"ฟรีเบส",pouch:"พาวช์ เม็ดอม นิโคตินพาวช์",abc:"เอบีซี",lego:"เลโก้",
 tank:"แท้งค์ แทงค์",switch:"สวิตช์ สวิท",swap:"สวอป",lumi:"ลูมิ",infinity:"อินฟินิตี้",
 ultra:"อัลตร้า",large:"ลาร์จ",creator:"ครีเอเตอร์",boost:"บูสท์",clear:"เคลียร์",
 zyn:"ซิน",zar:"ซาร์",kardinal:"คาร์ดินัล",phatjuice:"แฟทจูซ",eskoliq:"เอสโกลิค",
 reload:"รีโหลด",plus:"พลัส",bar:"บาร์",pro:"โปร",nano:"นาโน",zero:"ซีโร่",
 diva:"ดีว่า",sparta:"สปาร์ต้า",kit:"คิท ชุด",pod:"พอต",go:"โก"};
function buildIndex(){
  IDX=[]; CATOF={};
  for(const c in CFG.pages) (CFG.pages[c]||[]).forEach(p=>CATOF[p]=c);
  for(const p in CFG.spots) (CFG.spots[p]||[]).forEach((sp,i)=>{
    let k=norm(sp.m+" "+sp.f+" "+(CATOF[p]||""));
    norm(sp.m).split(/[^a-z0-9]+/).forEach(w=>{ if(TH[w]) k+=" "+TH[w]; });
    IDX.push({p:p,i:i,m:sp.m,f:sp.f,k:k});
  });
}
function spOK(sp){
  const v=STOCK?STOCK[sp.m+"|"+norm(sp.f)]:undefined, q=qtyOf(sp);
  if(v===undefined&&q===null) return true;          // ไม่มีข้อมูล = ไม่ตัดสิน
  return (v!==undefined)?(v===true):(q>0);
}
function findAll(t){ return IDX.filter(o=>t.every(x=>o.k.indexOf(x)>=0)); }
// พิมพ์ติดกันไม่เว้นวรรคก็ได้ เช่น "มาโบองุ่น" → ระบบตัดคำให้เอง
function smartFind(q){
  const t=q.split(" ").filter(Boolean);
  let r=findAll(t); if(r.length) return r;
  const last=t[t.length-1]||"", head=t.slice(0,-1);
  for(let i=2;i<=last.length-2;i++){
    const c=findAll(head.concat([last.slice(0,i),last.slice(i)]));
    if(c.length) return c;
  }
  for(let i=2;i<=last.length-4;i++) for(let j=i+2;j<=last.length-2;j++){
    const c=findAll(head.concat([last.slice(0,i),last.slice(i,j),last.slice(j)]));
    if(c.length) return c;
  }
  return [];
}
function doSearch(){
  const box=document.getElementById("qres");
  const q=norm(document.getElementById("q").value);
  if(q.length<2){ box.classList.remove("on"); box.innerHTML=""; return; }
  let r=smartFind(q);
  r.forEach(o=>o.ok=spOK(CFG.spots[o.p][o.i]));
  r.sort((a,b)=>(b.ok-a.ok)||a.m.localeCompare(b.m,"th")||a.f.localeCompare(b.f,"th"));
  box.classList.add("on");
  if(!r.length){ box.innerHTML='<div class="qn">ไม่พบ "'+document.getElementById("q").value+'"<br>ลองพิมพ์ชื่อรุ่นหรือชื่อกลิ่นสั้น ๆ</div>'; return; }
  const has=r.filter(o=>o.ok).length;
  let h='<div class="qn" style="padding:9px 13px;text-align:left;border-bottom:1px solid #f1f1f1">พบ '+r.length+' รายการ · มีของ '+has+'</div>';
  r.slice(0,80).forEach(o=>{
    h+='<div class="qi" data-p="'+esc(o.p)+'" data-i="'+o.i+'"><div class="qt">'
      +'<div class="qm">'+esc(o.m)+'</div><div class="qf">'+esc(o.f)+'</div></div>'
      +'<span class="qb '+(o.ok?'ok':'no')+'">'+(o.ok?'มีของ':'หมด')+'</span></div>';
  });
  if(r.length>80) h+='<div class="qn">แสดง 80 จาก '+r.length+' รายการ — พิมพ์เพิ่มเพื่อกรองให้แคบลง</div>';
  box.innerHTML=h;
}
function esc(x){ return String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function openSearch(){
  document.getElementById("sbtn").style.display="none";
  document.getElementById("sbar").classList.add("on");
  document.getElementById("q").focus();
}
function closeSearch(){
  clearQ();
  document.getElementById("sbar").classList.remove("on");
  document.getElementById("sbtn").style.display="";   /* ล้าง inline ให้กลับไปใช้ display:flex จาก CSS (ถ้าใส่ block ปุ่มจะไหลไปชิดซ้าย) */
}
function clearQ(){ document.getElementById("q").value=""; doSearch(); }
function goSpot(p,i){
  const cat=CATOF[p];
  document.getElementById("qres").classList.remove("on");
  document.getElementById("q").blur();
  if(cat) openCat(cat);
  setTimeout(function(){
    const el=document.querySelector('#catpages .hot[data-p="'+p+'"][data-i="'+i+'"]');
    if(el){ el.scrollIntoView({block:"center"}); el.classList.add("flash");
            setTimeout(()=>el.classList.remove("flash"),1800); }
    openSheet(p,i);
  },60);
}
let MISS=[];
// ── สต็อกสำรองจากไฟล์ XSelly: เก็บแค่ 1=มีของ / 0=หมด ไม่เก็บจำนวนจริง ──
function qtyOf(sp){
  const S=CFG.stock; if(!S) return null;
  const v=S[sp.m+"|"+norm(sp.f)];
  return (v===undefined)?null:v;
}
function paintStock(){
  if(!STOCK) return;
  MISS=[];
  document.querySelectorAll("#catpages .hot").forEach(d=>{
    const sp=(CFG.spots[d.dataset.p]||[])[d.dataset.i]; if(!sp) return;
    const v=STOCK[sp.m+"|"+norm(sp.f)];
    const q=qtyOf(sp);                       // 1=มีของ 0=หมด (ไม่ใช่จำนวนจริง)
    if(v===undefined && q===null){ MISS.push(sp.m+" | "+sp.f); return; }  // ไม่มีข้อมูล = ไม่แตะภาพ
    // /menustock สดกว่า → ชนะเสมอเรื่อง มี/หมด · ตัวเลขจาก Excel ใช้เฉพาะตอนไม่มีข้อมูลสด
    /* ปิดชั่วคราว — ยืนยันจาก XSelly 2 ก.ย. ว่าหมดจริง แต่ระบบสต็อกยังตอบ "มี" (รอจีทูแก้ mapping #141 แล้วค่อยถอด) */
      const FORCE_OUT = new Set(["เครื่อง M SWITCH 15K|","เครื่อง M SWITCH 15K (โคลน)|","RELX BOOST POD|ดับเบิ้ลมิ้นต์ 5%"]);
      const out = FORCE_OUT.has(sp.m+"|"+norm(sp.f)) ? true : ((v!==undefined) ? (v!==true) : (q===0));
    d.classList.toggle("out", out);
  });
  if(document.getElementById("qres").classList.contains("on")) doSearch();
  if(new URLSearchParams(location.search).get("debug")){
    document.getElementById("livetxt").textContent =
      "ตรวจสอบ: จับคู่ไม่ได้ "+MISS.length+" จุด"+(MISS.length?" · "+MISS.slice(0,3).join(" / "):" · ครบทุกจุด ✅");
    if(MISS.length) console.log("จับคู่สต็อกไม่ได้:",MISS);
  }
}
setInterval(loadStock,120000);

let MSG="";
function openSheet(p,i){
  const sp=CFG.spots[p][i];
  const el=document.querySelector('#catpages .hot[data-p="'+p+'"][data-i="'+i+'"]');
  const inStock=!el.classList.contains("out");
  document.getElementById("sh_m").textContent=sp.m;
  /* เครื่อง/อุปกรณ์ใช้ "สี" ไม่ใช่ "กลิ่น" · รุ่นสีเดียว f ว่าง = ไม่แสดงบรรทัดกลิ่นเลย */
  const isColor = sp.f.startsWith("สี") || sp.f==="";
  document.getElementById("sh_f").textContent = sp.f==="" ? "" : (isColor ? sp.f : ("กลิ่น "+sp.f));
  const pz=priceOf(sp.m);
  document.getElementById("sh_pr").innerHTML = pz==null ? "" : (pz.toLocaleString("th-TH")+' <span>บาท</span>');
  let line = inStock
    ? '<span style="color:#1d7c3d">✅ มีของพร้อมส่ง</span>'
    : '<span style="color:#b42323">⛔ กลิ่นนี้หมดชั่วคราว — เลือกกลิ่นอื่น หรือสอบถามในแชทได้ค่ะ</span>';
  // ── ไม่แสดงจำนวนสต็อกให้ลูกค้าเห็น (ข้อมูลลับของบริษัท) ──
  document.getElementById("sh_st").innerHTML=line;
  MSG=(sp.f==="")?sp.m:(sp.m+(isColor?" ":" กลิ่น ")+sp.f);   /* เครื่อง → "รุ่น สีดำ" หรือแค่ชื่อรุ่น · น้ำยา → "รุ่น กลิ่น พีช" */
  document.getElementById("sh_msg").textContent=MSG;
  document.getElementById("sh_ok").textContent="";
  document.getElementById("sheetbg").style.display="block";
  document.getElementById("sheet").classList.add("on");
}
function closeSheet(){ document.getElementById("sheet").classList.remove("on");
  document.getElementById("sheetbg").style.display="none"; }
async function orderGo(){
  try{ await navigator.clipboard.writeText(MSG); }
  catch(e){ const t=document.createElement("textarea"); t.value=MSG; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  document.getElementById("sh_ok").textContent="✅ คัดลอกแล้วค่ะ — กลับไปที่แชทไลน์ แล้ววางข้อความส่งได้เลย";
}
