.wrap{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
.live{position:sticky;top:0;z-index:12;background:#0b0b0b;color:#c6f45f;font-size:11.5px;

.stage img.base{width:100%;height:auto;display:block}
.hot{position:absolute;border-radius:999px;cursor:pointer}
.hot.out{background:rgba(233,233,233,.93);box-shadow:0 0 0 1px rgba(0,0,0,.10) inset;

.hot.sm.out::after{font-size:9px}
.backbar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:14;
  background:#0b0b0bf2;backdrop-filter:blur(6px);padding:9px 12px;display:none;gap:8px}
.backbar.on{display:flex}
.backbar button{flex:1;border:none;border-radius:11px;padding:11px;font-family:inherit;

.soon{padding:60px 26px;text-align:center;color:#666;font-size:14px;line-height:1.9}
.soon b{display:block;font-size:17px;color:#111;margin-bottom:8px}
#sheetbg{display:none;position:fixed;inset:0;background:#000a;z-index:30}
#sheet{position:fixed;left:0;right:0;bottom:-110%;max-width:560px;margin:0 auto;background:#fff;

#sheet .msg{margin-top:12px;background:#f3f3f3;border-radius:12px;padding:11px;font-size:13.5px;color:#222}
#sheet button{width:100%;margin-top:10px;border:none;border-radius:12px;padding:13px;
  font-size:14.5px;font-weight:800;font-family:inherit;cursor:pointer}
.go{background:#111;color:#fff}.cls{background:#eee;color:#333}
.okmsg{color:#1d7c3d;font-size:12.5px;margin-top:8px;display:block}

function buildHome(){
  const st=document.getElementById("homestage");
  CFG.home.hot.forEach(h=>{
    const d=document.createElement("div");
    d.className="hot";
    d.style.cssText=`left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%`;
    d.onclick=()=>openCat(h.c);
    st.appendChild(d);
  });
}

function openCat(cat){
  const pages=CFG.pages[cat]||[];
  const box=document.getElementById("catpages");
  box.innerHTML="";
  if(!pages.length){
    box.innerHTML='<div class="soon"><b>'+cat+'</b>หมวดนี้กำลังเตรียมไฟล์ภาพอยู่<br>สอบถามสินค้าในหมวดนี้ผ่านแชทไลน์ได้เลยค่ะ</div>';
  } else {
    pages.forEach(p=>{
      const s=document.createElement("div"); s.className="stage";
      s.innerHTML='<img class="base" loading="lazy" src="img/menu3/'+p+'.jpg" alt="'+cat+'">';
      (CFG.spots[p]||[]).forEach((sp,i)=>{
        const d=document.createElement("div");
        d.className="hot"+(sp.w<4.5?" sm":"");
        d.style.cssText=`left:${sp.x}%;top:${sp.y}%;width:${sp.w}%;height:${sp.h}%`;
        d.dataset.p=p; d.dataset.i=i;
        d.onclick=()=>openSheet(p,i);
        s.appendChild(d);
      });
      box.appendChild(s);
    });
  }
  document.getElementById("v_home").classList.remove("on");
  document.getElementById("v_cat").classList.add("on");
  document.getElementById("backbar").classList.add("on");
  scrollTo(0,0); paintStock();
}
function goHome(){
  document.getElementById("v_cat").classList.remove("on");
  document.getElementById("v_home").classList.add("on");
  document.getElementById("backbar").classList.remove("on");
  scrollTo(0,0);
}

// ── สต็อกสด: /menustock คีย์ "ชื่อรุ่น|กลิ่น" (normalize ตัวพิมพ์ให้ตรงกัน) ──
function loadStock(){
  fetch(W+"/menustock").then(r=>r.json()).then(raw=>{
    const st={}; TRACKED=new Set();
    for(const k in raw){ const i=k.indexOf("|"); if(i<0) continue;
      const mn=k.slice(0,i); st[mn+"|"+norm(k.slice(i+1))]=raw[k]; TRACKED.add(mn); }
    STOCK=st; paintStock();
    document.getElementById("livetxt").textContent=
      "สต็อกสด · อัปเดต "+new Date().toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" น.";
  }).catch(()=>{ document.getElementById("livetxt").textContent="แสดงรายการสินค้า"; });
}
function paintStock(){
  if(!STOCK) return;
  document.querySelectorAll("#catpages .hot").forEach(d=>{
    const sp=(CFG.spots[d.dataset.p]||[])[d.dataset.i]; if(!sp) return;
    if(!TRACKED.has(sp.m)) return;                 // ไม่มีข้อมูลรุ่นนี้ = ไม่แตะภาพ
    d.classList.toggle("out", STOCK[sp.m+"|"+norm(sp.f)]!==true);
  });
}
setInterval(loadStock,120000);

let MSG="";
function openSheet(p,i){
  const sp=CFG.spots[p][i];
  const el=document.querySelector('#catpages .hot[data-p="'+p+'"][data-i="'+i+'"]');
  const inStock=!el.classList.contains("out");
  document.getElementById("sh_m").textContent=sp.m;
  document.getElementById("sh_f").textContent="กลิ่น "+sp.f;
  document.getElementById("sh_st").innerHTML=inStock
    ? '<span style="color:#1d7c3d">✅ มีของพร้อมส่ง</span>'
    : '<span style="color:#b42323">⛔ กลิ่นนี้หมดชั่วคราว — เลือกกลิ่นอื่น หรือสอบถามในแชทได้ค่ะ</span>';
  MSG="สนใจ "+sp.m+" กลิ่น"+sp.f+" ค่ะ";
  document.getElementById("sh_msg").textContent=MSG;
  document.getElementById("sh_ok").textContent="";
  document.getElementById("sheetbg").style.display="block";
  document.getElementById("sheet").classList.add("on");
}
function closeSheet(){ document.getElementById("sheet").classList.remove("on");
  document.getElementById("sheetbg").style.display="none"; }
async function orderGo(){
  try{ await navigator.clipboard.writeText(MSG); }
  catch(e){ const t=document.createElement("textarea"); t.value=MSG; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  document.getElementById("sh_ok").textContent="✅ คัดลอกแล้วค่ะ — กลับไปที่แชทไลน์ แล้ววางข้อความส่งได้เลย";
}
